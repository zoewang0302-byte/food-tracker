<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>美食消費紀錄</title>
<style>
body {
font-family: Arial, sans-serif;
background: #f5f7f5;
padding: 24px;
}
.container {
max-width: 420px;
margin: 30px auto;
background: white;
padding: 24px;
border-radius: 16px;
}
input, button {
width: 100%;
padding: 12px;
margin: 8px 0 18px;
box-sizing: border-box;
}
button {
background: #06c755;
color: white;
border: none;
border-radius: 8px;
}
</style>
</head>
<body>
<div class="container">
<h2>🍜 美食消費紀錄</h2>
<p>記錄今天吃了什麼！</p>

<form id="mealForm">
<label>餐廳名稱</label>
<input type="text" name="restaurant"
placeholder="例如：麥食堂" required>

<label>消費金額（元）</label>
<input type="number" name="amount"
min="1" placeholder="例如：150" required>

<label>用餐日期</label>
<input type="date" name="mealDate" required>

<button type="submit">儲存消費紀錄</button>
</form>

<p id="result"></p>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const webhookUrl =
  "https://zoe36875.app.n8n.cloud/webhook-test/meal-record";
  async function initLiff() {
  try {
    await liff.init({
      liffId: "2012195207-0B05X0PU"
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    console.log("LIFF 登入成功");
  } catch (error) {
    console.error("LIFF 初始化失敗", error);
  }
}

initLiff();

document.getElementById("mealForm")
  .addEventListener("submit", async function(e) {
    e.preventDefault();

    const form = e.target;
    const result = document.getElementById("result");

    const data = {
      restaurant: form.restaurant.value,
      amount: Number(form.amount.value),
      mealDate: form.mealDate.value
    };

    result.textContent = "正在傳送資料...";

    try {
      const response = await fetch(webhookUrl, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(data)
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      result.textContent = "資料已送出！";
    } catch (error) {
      result.textContent =
        "傳送失敗：" + error.message;
    }
  });
</script>

</body>
</html>
